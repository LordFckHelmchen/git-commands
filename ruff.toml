# Via pre-commit
line-length = 120
preview = true

[format]
docstring-code-format = true
skip-magic-trailing-comma = true

[lint]
select = ["ALL"]
ignore = [
    "AIR", # Disable all Airflow-related rules - not relevant here
    "missing-trailing-comma", # Comma warning suggested by ruff to be ignored
    "undocumented-public-module", # Allow missing docstring in public module
    "undocumented-public-package", # Allow missing docstring in public package
    "undocumented-magic-method", # Allow missing docstring in magic method
    "FAST", # Disable all FastAPI-related rules - not relevant here
    "TD", # Disable ToDo-Formatting - we don't allow TODOs in the code (detected via FIX rules)
    "print", # Allow print statements (used in scripts)
]

[lint.isort]
force-single-line = true

[lint.flake8-type-checking]
strict = true

[lint.pydocstyle]
convention = "numpy"
